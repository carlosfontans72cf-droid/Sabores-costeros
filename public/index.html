<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabores Costeros - Iniciar Sesión</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/styles.css">
  <meta name="theme-color" content="#48CAE4">
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="logo-container">
        <img src="/img/logo.png" alt="Sabores Costeros" class="logo" style="max-width:200px;">
      </div>
      <h2 class="app-title">Sabores Costeros</h2>
      <p class="app-subtitle" id="subtitle" data-i18n="app-subtitle">Descubrí los mejores restaurantes de la costa</p>

      <div class="language-selector">
        <button onclick="cambiarIdioma('es')" class="lang-btn active" id="btn-es">🇪 ES</button>
        <button onclick="cambiarIdioma('pt')" class="lang-btn" id="btn-pt">🇧 PT</button>
        <button onclick="cambiarIdioma('en')" class="lang-btn" id="btn-en">🇺🇸 EN</button>
      </div>

      <div id="login-form">
        <div class="form-group">
          <label id="label-email" data-i18n="label-email">Email</label>
          <input type="email" id="email" class="form-control" data-i18n-placeholder="placeholder-email" placeholder="tu@email.com" autocomplete="off">
        </div>

        <div class="form-group" style="position: relative;">
          <label id="label-password" data-i18n="label-password">Contraseña</label>
          <input type="password" id="password" class="form-control" data-i18n-placeholder="placeholder-password" placeholder="Contraseña" style="padding-right:42px;">
          <button type="button" class="btn-toggle-password" onclick="togglePassword()">👁</button>
        </div>

        <div id="login-error" class="error-message"></div>

        <button id="btn-login" class="btn btn-primary btn-block" data-i18n="btn-login">
          Iniciar Sesión
        </button>

        <p class="switch-form">
          <span id="text-no-account" data-i18n="text-no-account">¿No tenés cuenta?</span>
          <a href="#" onclick="showRegister()" data-i18n="link-register">Registrate</a>
        </p>
      </div>

      <div id="register-form" style="display:none;">
        <div class="form-group">
          <label id="label-nombre" data-i18n="label-nombre">Nombre</label>
          <input type="text" id="reg-nombre" class="form-control" data-i18n-placeholder="placeholder-nombre" placeholder="Tu nombre">
        </div>

        <div class="form-group">
          <label id="label-apellido" data-i18n="label-apellido">Apellido</label>
          <input type="text" id="reg-apellido" class="form-control" data-i18n-placeholder="placeholder-apellido" placeholder="Tu apellido">
        </div>

        <div class="form-group">
          <label id="label-email-reg" data-i18n="label-email-reg">Email</label>
          <input type="email" id="reg-email" class="form-control" data-i18n-placeholder="placeholder-email-reg" placeholder="tu@email.com">
        </div>

        <div class="form-group">
          <label id="label-password-reg" data-i18n="label-password-reg">Contraseña</label>
          <input type="password" id="reg-password" class="form-control" data-i18n-placeholder="placeholder-password-reg" placeholder="Mínimo 6 caracteres">
        </div>

        <div class="form-group">
          <label data-i18n="label-role">Quiero registrarme como:</label>
          <select id="reg-role" class="form-control">
            <option value="cliente" data-i18n="role-cliente">🌊 Turista / Cliente</option>
            <option value="restaurante" data-i18n="role-restaurante"> Dueño de restaurante</option>
            <option value="embajador" data-i18n="role-embajador">🌟 Embajador (Promotor)</option>
          </select>
        </div>

        <div class="form-group" id="codigo-promotor-group" style="display:none;">
          <label data-i18n="label-codigo-emb">Tu código de Embajador (opcional)</label>
          <input type="text" id="reg-codigo-embajador" class="form-control" data-i18n-placeholder="placeholder-codigo" placeholder="Ej: EMB001">
        </div>

        <div id="register-error" class="error-message"></div>

        <button id="btn-register" class="btn btn-primary btn-block" data-i18n="btn-register">
          Crear cuenta
        </button>

        <p class="switch-form">
          <span id="text-have-account" data-i18n="text-have-account">¿Ya tenés cuenta?</span>
          <a href="#" onclick="showLogin()" data-i18n="link-login">Iniciá sesión</a>
        </p>

        <p class="legal-text">
          <span data-i18n="legal-text">Al registrarte, aceptás nuestra</span>
          <a href="/pages/politica-privacidad.html" target="_blank" data-i18n="footer-privacidad">Política de Privacidad</a>
          y
          <a href="/pages/terminos-condiciones.html" target="_blank" data-i18n="footer-terminos">Términos y Condiciones</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    import { applyTranslations, cambiarIdioma as cambiarIdiomaMod } from '/js/utils.js';

    window.cambiarIdioma = function(idioma) {
      cambiarIdiomaMod(idioma);
    };

    applyTranslations();
  </script>

  <script>
    function togglePassword() {
      const p = document.getElementById('password');
      const r = document.getElementById('reg-password');
      if (document.getElementById('login-form').style.display !== 'none') {
        p.type = p.type === 'password' ? 'text' : 'password';
      } else {
        r.type = r.type === 'password' ? 'text' : 'password';
      }
    }

    function showRegister() {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('register-form').style.display = 'block';
    }

    function showLogin() {
      document.getElementById('register-form').style.display = 'none';
      document.getElementById('login-form').style.display = 'block';
    }

    document.getElementById('reg-role')?.addEventListener('change', (e) => {
      const grupo = document.getElementById('codigo-promotor-group');
      if (e.target.value === 'embajador') {
        grupo.style.display = 'block';
      } else {
        grupo.style.display = 'none';
      }
    });

    const idiomaGuardado = sessionStorage.getItem('idioma');
    if (idiomaGuardado) {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + idiomaGuardado)?.classList.add('active');
    }
  </script>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
